# Theme
theme:
  name: 'material'
  custom_dir: overrides
  language: 'zh'
  logo: ""
  features:
    # 章节标签本身即为该章 hub 页的链接（nav 中每节首个条目），
    # 避免"先点章节展开、再点章节导读"两步操作。
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    primary: 'white'
    accent: 'red'
  include_search_page: false
  search_index_only: true
  font:
    text: 'Fira Sans'
    code: 'Fira Mono'

extra:
  analytics:
    provider: google
    property: G-N0PZM76K4V

# Plugins
plugins:
  - search:
      # 站点为纯中文：jieba 分词后以零宽空格 \u200b 分隔，separator 必须包含该字符，
      # 否则整段中文会被当作单个 token，搜索基本失效。jieba 见 requirements.txt。
      separator: '[\s\u200b\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      lang:
        - zh
        - en
  - git-revision-date-localized:
      type: date
      locale: zh
      fallback_to_build_date: true
  # 章节导读页由 <chapter>/main.md 改名为 <chapter>/index.md（启用 navigation.indexes
  # 需要文件名为 index），旧地址 /<chapter>/main/ 仍有站外入链，此处做永久跳转。
  - redirects:
      redirect_maps:
        intro/main.md: intro/index.md
        system/main.md: system/index.md
        hardware/main.md: hardware/index.md
        algorithm/main.md: algorithm/index.md
        simulation/main.md: simulation/index.md
        vlm/main.md: vlm/index.md
        casestudy/main.md: casestudy/index.md

# Extra
extra_javascript:
  # 顺序不能颠倒：MathJax 3 在脚本加载时读取 window.MathJax，
  # 配置文件必须排在 CDN 包之前，否则 macros/tagformat/tagSide 会被静默丢弃。
  - _static/js/mathjaxhelper.js
  - 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js'

extra_css:
    - _static/css/extra.css

# Extensions
markdown_extensions:
  - admonition
  - extra
  - tables
  - fenced_code
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - .
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
